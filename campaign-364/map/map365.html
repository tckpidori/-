<style>

:root{

  --sans:"PT Sans","Segoe UI",system-ui,sans-serif; --serif:"PT Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1c1e; --panel:#24262a; --fg:#ecebe7; --muted:#a6a39c; --line:#3a3c40; --accent:#ff7a66; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1b1c1e; --panel:#24262a; --fg:#ecebe7; --muted:#a6a39c; --line:#3a3c40; --accent:#ff7a66; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:10px}
h1{font-size:clamp(22px,2.6vw,30px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:940px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sea);aspect-ratio:3420/2400;max-width:100%;min-width:0}
.stage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg:active{cursor:grabbing}
.ctl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.ctl button{width:32px;height:32px;font:700 16px var(--sans);color:#1d1d1b;background:#fff;border:1px solid rgba(0,0,0,.3);border-radius:4px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:8px 10px;font:700 13px var(--sans);color:var(--fg);background:var(--panel);border:0;border-left:1px solid var(--line);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card h2{font-size:15px;margin:0 0 8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
#info{min-height:150px}
#info .name{font-size:22px;font-weight:700;margin:0 0 6px;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.list{display:grid;gap:2px;margin:0;padding:0;list-style:none;font-size:13px}
.list li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.list li small{display:block;color:var(--muted);font-size:11.5px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10.5px var(--sans);color:#fff;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
svg text{pointer-events:none;user-select:none;font-family:var(--sans)}
.u{cursor:pointer}
</style>

g.append("path").attr("d",M.rivers.map(l=>{let d="M"+l[0]+","+l[1]; for(let i=2;i<l.length;i+=2) d+="L"+l[i]+","+l[i+1]; return d;}).join("")).attr("fill","none").style("stroke","var(--river)").attr("stroke-width",1.1).attr("stroke-linejoin","round").attr("vector-effect","non-scaling-stroke").attr("pointer-events","none");
const pC=g.append("g").selectAll("path").data(cityIds).join("path").attr("class","u").attr("d",u=>shape[u]);
// border sets
let dProv="",dReg="",dRealm="",dPars="",dCoast="",dCity="";
M.meta.forEach(([l,r],i)=>{ if(l===-2||r===-2) return; const a=arcD(A[i]);
  const wl=(l===-9||l===-5||l===-3), wr=(r===-9||r===-5||r===-3);
  if(wl||wr){ if(!(wl&&wr)) dCoast+=a; return; }
  if(isCity(l)||isCity(r)){ dCity+=a; return; }
  const rl=reg(l), rr=reg(r);
  if(l===-4||r===-4){ if(rl!==rr) dReg+=a; return; }
  const el=realm(l), er=realm(r);
  if(el!==er) dRealm+=a; else if(rl!==rr){ dReg+=a; if(el==="ROM" && R[rl].f!==R[rr].f) dPars+=a; } else dProv+=a; });
const B=g.append("g").attr("fill","none").attr("pointer-events","none").attr("stroke-linejoin","round").attr("stroke-linecap","round");
const bProv=B.append("path").attr("d",dProv).style("stroke","#8f8a7e").attr("stroke-width",.6).attr("stroke-opacity",.75).attr("vector-effect","non-scaling-stroke");
const bReg=B.append("path").attr("d",dReg).style("stroke","#6e6a62").attr("stroke-width",1.1).attr("stroke-dasharray","5 3").attr("vector-effect","non-scaling-stroke");
const bPars=B.append("path").attr("d",dPars).style("stroke","#7a3b12").attr("stroke-width",2).attr("stroke-dasharray","8 4").attr("vector-effect","non-scaling-stroke");
const bRealm=B.append("path").attr("d",dRealm).style("stroke","#4d4a44").attr("stroke-width",1.6).attr("vector-effect","non-scaling-stroke");
B.append("path").attr("d",dCoast).style("stroke","#5b8fa6").attr("stroke-width",.9).attr("vector-effect","non-scaling-stroke");
const bCity=B.append("path").attr("d",dCity).style("stroke","#3d2f22").attr("stroke-width",.9).attr("vector-effect","non-scaling-stroke");
const hl=B.append("path").style("stroke","var(--accent)").attr("stroke-width",2.6).attr("vector-effect","non-scaling-stroke").attr("fill-rule","evenodd");
// labels
const L=g.append("g");
const lSea=L.selectAll("text.sea").data(M.seas).join("text").attr("x",d=>d.x).attr("y",d=>d.y).attr("text-anchor","middle").style("fill","var(--sea-ink)")
  .attr("font-style","italic").attr("font-family","PT Serif, Georgia, serif").text(d=>d.n);
const realmKeys=Object.keys(RM).filter(k=>RM[k].a&&RM[k].A>2500);
const lRealm=L.selectAll("text.realm").data(realmKeys).join("text").attr("x",k=>RM[k].a[0]).attr("y",k=>RM[k].a[1]).attr("text-anchor","middle").attr("font-weight",700)
  .style("fill","#26241f").attr("letter-spacing",".04em").text(k=>RM[k].n);
const regIds=R.map((r,i)=>i).filter(i=>R[i].a&&R[i].A>300);
const lReg=L.selectAll("text.reg").data(regIds).join("text").attr("x",i=>R[i].a[0]).attr("y",i=>R[i].a[1]).attr("text-anchor","middle").style("fill","#1d1d1b").text(i=>R[i].ru);
const lCity=L.selectAll("text.city").data(cityIds.filter(u=>U[u].a)).join("text").attr("x",u=>U[u].a[0]).attr("y",u=>U[u].a[1]).attr("text-anchor","middle")
  .style("fill","#2a1f14").style("stroke","rgba(255,255,255,.85)").attr("paint-order","stroke").attr("stroke-linejoin","round").attr("font-weight",700).text(u=>U[u].n);
const MK=g.append("g").attr("pointer-events","none").selectAll("g").data(M.players).join("g").attr("transform",p=>`translate(${p.x},${p.y})`);
MK.append("circle").style("fill",p=>p.c).style("stroke","#fff").attr("stroke-dasharray",p=>p.secret?"3 2":null);
MK.append("text").attr("text-anchor","middle").attr("dominant-baseline","central").attr("font-weight",700).style("fill",p=>p.n===13?"#222":"#fff").text(p=>p.n);
// layers
let layer="P";
const mix=(c,p,b)=>`color-mix(in srgb, ${c} ${p}%, ${b||"#ffffff"})`;
function fillOf(u){
  const r=reg(u), city=isCity(u);
  if(r<0) return city?"#d8d8d8":"var(--land)";
  if(layer==="P") return RM[R[r].realm].c;
  const p=R[r].p; const base=p?mix(PCOL[p],p===13?100:58):(R[r].realm==="ROM"?"#f4e3b5":"#e6e6e6");
  return city?(p?mix(PCOL[p],80,"#3a2a1a"):"#cbbd99"):base;
}
function applyLayer(){
  pP.style("fill",fillOf); pC.style("fill",fillOf);
  const pol=layer==="P";
  bProv.attr("display",pol?"none":null); bReg.attr("display",pol?"none":null); bPars.attr("display",pol?null:"none"); bCity.attr("display",pol?"none":null);
  lRealm.attr("display",pol?null:"none"); MK.attr("display",pol?"none":null);
  document.getElementById("lP").setAttribute("aria-pressed",pol); document.getElementById("lC").setAttribute("aria-pressed",!pol);
  legend(); size();
}
let k=1;
function size(){ const s=1/k, pol=layer==="P";
  lSea.attr("font-size",d=>(d.fs||(d.big?44:26))*s).attr("letter-spacing",d=>d.big?".25em":".12em").attr("transform",d=>d.rot?`rotate(${d.rot} ${d.x} ${d.y})`:null);
  lRealm.attr("font-size",k=>Math.max(22,Math.min(64,Math.sqrt(RM[k].A)/9))*Math.max(s,.4));
  lReg.attr("font-size",i=>Math.max(13,Math.min(30,Math.sqrt(R[i].A)/7))*Math.max(s,.45)).attr("display",i=>(!pol||k>=2.2)?((k<1.4&&R[i].A<2500)?"none":null):"none");
  lCity.attr("font-size",15*s+1).attr("stroke-width",3.5*s).attr("dy",-10*s).attr("display",k>=2?null:"none");
  [lSea,lRealm,lReg].forEach(sel=>sel.each(function(){ const t=this; if(t.getAttribute("transform")) return; const x0=+t.getAttribute("data-x")||+t.getAttribute("x"); t.setAttribute("data-x",x0);
     const w=t.getComputedTextLength(), pad=8*s; t.setAttribute("x",Math.max(w/2+pad,Math.min(M.W-w/2-pad,x0))); }));
  MK.select("circle").attr("r",15*s+3).attr("stroke-width",2.5*s); MK.select("text").attr("font-size",15*s+2);
}
const zoom=d3.zoom().scaleExtent([1,16]).translateExtent([[0,0],[M.W,M.H]]).on("zoom",e=>{g.attr("transform",e.transform);k=e.transform.k;size();});
svg.call(zoom);
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick=()=>svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity);
document.getElementById("lP").onclick=()=>{layer="P";applyLayer();}; document.getElementById("lC").onclick=()=>{layer="C";applyLayer();};
// info
let sel=null;
function show(u){
  hl.attr("d",shape[u]); const r=reg(u), un=U[u];
  const rg=r>=0?R[r]:null, rm=rg?RM[rg.realm]:null, p=rg&&rg.p?M.players.find(x=>x.n===rg.p):null;
  document.getElementById("info").innerHTML=`<p class="eyebrow">${isCity(u)?"Город":"Провинция"}</p><p class="name">${un.n}</p>
   <dl class="kv"><dt>Область</dt><dd>${rg?`${rg.ru} <span style="color:var(--muted)">(${rg.la})</span>`:"вне игровых областей"}</dd>
   <dt>Государство</dt><dd>${rm?`<span class="sw" style="background:${rm.c}"></span>${rm.n}`:"—"}</dd>
   <dt>Игрок</dt><dd>${p?`<span class="sw" style="background:${p.c}"></span>№${p.n} ${p.name}`:"нет"}</dd>
   ${isCity(u)?`<dt>В CK3</dt><dd>${un.b}</dd>`:""}</dl>`;
}
[pP,pC].forEach(s=>s.on("pointerenter",(e,u)=>show(u)).on("pointerleave",()=>{ if(sel!==null) show(sel); else hl.attr("d",""); }).on("click",(e,u)=>{sel=u;show(u);}));
function legend(){
  const ul=document.getElementById("legend"); ul.innerHTML="";
  if(layer==="P"){
    document.getElementById("lgT").textContent="Государства";
    ["ROM","PERS","ARM","ALAM","FRANC","TERV","GREU","HUNS","MAUR","MUMU"].forEach(k=>{ const li=document.createElement("li");
      li.innerHTML=`<span class="sw" style="width:18px;height:14px;background:${RM[k].c}"></span><span>${RM[k].n}</span>`; ul.appendChild(li); });
    { const li=document.createElement("li"); li.innerHTML=`<span class="sw" style="width:18px;height:14px;background:#d6d3cc"></span><span>Независимые племена и царства</span>`; ul.appendChild(li); }
    document.getElementById("lgN").textContent="Пунктир внутри империи: граница между Западом Валентиниана и Востоком Валента.";
  } else {
    document.getElementById("lgT").textContent="Игроки";
    M.players.forEach(p=>{ const li=document.createElement("li");
      li.innerHTML=`<span class="dot" style="background:${p.c};${p.n===13?"color:#222":""}">${p.n}</span><span>${p.name}<small>${p.regions.length?p.regions.join(", "):(p.secret?"тайное убежище, областей нет":"областей нет")}</small></span>`; ul.appendChild(li); });
    document.getElementById("lgN").textContent="Серые области без игрока остаются за ведущим. Пунктир: границы областей, тонкие линии: провинции.";
  }
}
document.getElementById("info").innerHTML=`<p class="eyebrow">Подсказка</p><p class="name">Наведите на провинцию</p><p class="note">Клик закрепляет выбор. Город: тёмное пятно с названием внутри провинции.</p>`;
applyLayer();
</script>
