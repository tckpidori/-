:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1c1e; --panel:#24262a; --fg:#ecebe7; --muted:#a6a39c; --line:#3a3c40; --accent:#ff7a66; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1b1c1e; --panel:#24262a; --fg:#ecebe7; --muted:#a6a39c; --line:#3a3c40; --accent:#ff7a66; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px}
header .sub{flex:1 1 320px;min-width:0}
h1{font-size:clamp(22px,2.6vw,30px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}

.stage{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sea);aspect-ratio:6840/4800;max-width:100%;min-width:0}
.stage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg:active{cursor:grabbing}
.ctl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.ctl button{width:32px;height:32px;font:700 16px var(--sans);color:#1d1d1b;background:#fff;border:1px solid rgba(0,0,0,.3);border-radius:4px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 14px;white-space:nowrap;font:700 13px var(--sans);color:var(--fg);background:var(--panel);border:0;border-left:1px solid var(--line);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card h2{font-size:15px;margin:0 0 8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
#info{min-height:158px}
#info .name{font-size:22px;font-weight:700;margin:0 0 6px;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.list{display:grid;gap:3px;margin:0;padding:0;list-style:none;font-size:13px}
.list li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.list li small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10.5px var(--sans);color:#fff;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
svg text{pointer-events:none;user-select:none}
.u{cursor:pointer}

  if(o.halo) o.el.style("stroke",o.halo).attr("paint-order","stroke").attr("stroke-linejoin","round");
  labels.push(o); }
M.seas.forEach(s=>addLabel({text:s.n,x:s.x,y:s.y,fs:s.big===2?17:(s.big>1?13.5:12.5),serif:1,italic:1,color:"var(--sea-ink)",sp:s.big===2?.2:(s.big>1?.14:.1),rot:s.rot,minK:s.big>1?1:1.7,layer:"B",prio:5e8}));
Object.keys(RM).forEach(k=>{ const m=RM[k]; if(!m.a) return; const rom=k==="ROM";
  addLabel({text:m.n,x:rom?M.W*0.335:m.a[0],y:rom?M.H*0.44:m.a[1],fs:rom?24:(m.ind?12.5:15),bold:1,color:rom?"#ffffff":(m.ind?"var(--people)":"#1f1d19"),
            halo:rom?"#4a1247":"rgba(255,255,255,.7)",hw:rom?4:2.5,sp:rom?.12:.03,minK:1,layer:"P",prio:rom?1e12:1e9+m.A}); });
R.forEach((r,i)=>{ if(!r.a) return; const rom=r.realm==="ROM";
  addLabel({text:r.ru,x:r.a[0],y:r.a[1],fs:r.A>120000?14:12.5,color:rom?"#161512":"var(--people)",halo:"rgba(255,255,255,.75)",hw:2.5,minK:1,layer:"C",prio:1e9+r.A}); });
provIds.forEach(u=>{ const p=U[u]; if(!p.a) return; if(R[p.r].ru===p.n) return;
  addLabel({text:p.n,x:p.a[0],y:p.a[1],fs:10.5,italic:1,color:"#3b3832",halo:"rgba(255,255,255,.6)",hw:2,minK:2.2,layer:"C",prio:1e6+p.A,fit:Math.sqrt(p.A)}); });
const CMIN={1:1,2:1.9,3:3.1,4:4.6};
cityIds.forEach(u=>{ const c=U[u]; if(!c.a) return;
  addLabel({text:c.n,x:c.a[0],y:c.a[1],fs:c.tier===1?12.5:11,bold:1,color:"#24180e",halo:"rgba(255,255,255,.9)",hw:3,minK:CMIN[c.tier],layer:"C",
            prio:(c.tier<=2?2e9:5e5)-c.tier*1e5,above:Math.sqrt(c.A/Math.PI)}); });
const MK=MKG.selectAll("g").data(M.players).join("g");
MK.append("circle").attr("r",9.5).style("fill",p=>p.c).style("stroke","#fff").attr("stroke-width",1.8).attr("stroke-dasharray",p=>p.secret?"3 2":null);
MK.append("text").attr("text-anchor","middle").attr("dominant-baseline","central").attr("font-weight",700).attr("font-size",10.5).style("font-family","var(--sans)").style("fill","#fff").text(p=>p.n);
let layer="P", T=d3.zoomIdentity, raf=0;
function layout(){ raf=0;
  const cw=svg.node().clientWidth||1000, ui=Math.max(.78,Math.min(1,cw/900));
  const s0=cw/M.W/ui, px=1/s0, k=T.k;      // px: viewBox units per (ui-scaled) css pixel
  const boxes=[], hit=(b)=>boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
  const mpos=p=>[T.applyX(p.x)-(p.cr?p.cr*k+12*px:0), T.applyY(p.y)];     // beside its city, not on top of it
  MK.attr("display",layer==="C"?null:"none").attr("transform",p=>{ const m=mpos(p); return `translate(${m[0]},${m[1]}) scale(${px})`; });
  if(layer==="C") M.players.forEach(p=>{ const [x,y]=mpos(p), r=11*px; boxes.push([x-r,y-r,x+r,y+r]); });
  const order=labels.filter(o=>(o.layer==="B"||o.layer===layer)&&k>=o.minK).sort((a,b)=>b.prio-a.prio);
  labels.forEach(o=>o.show=false);
  for(const o of order){
    let x=T.applyX(o.x), y=T.applyY(o.y); if(o.above) y-=(o.above*k+5*px);
    if(x<-50*px||y<-20*px||x>M.W+50*px||y>M.H+20*px) continue;
    if(!o.w){ cv.font=`${o.italic?"italic ":""}${o.bold?700:400} ${o.fs}px ${o.serif?"PT Serif, Georgia, serif":"PT Sans, Segoe UI, sans-serif"}`; o.w=cv.measureText(o.text).width+(o.sp||0)*o.fs*o.text.length; }
    if(o.fit && o.w>o.fit*k*s0*1.5) continue;                      // the province is still too small on screen for its name
    let w=o.w*px, h=o.fs*px, bx;
    if(o.rot){ const c=Math.abs(Math.cos(o.rot*Math.PI/180)), s=Math.abs(Math.sin(o.rot*Math.PI/180)); const ww=w*c+h*s, hh=w*s+h*c; bx=[x-ww/2,y-hh/2,x+ww/2,y+hh/2]; }
    else bx=[x-w/2-2*px,y-h*.85,x+w/2+2*px,y+h*.3];
    if(hit(bx)) continue; boxes.push(bx); o.show=true; o.sx=x; o.sy=y;
  }
  labels.forEach(o=>{ if(!o.show){ o.el.attr("display","none"); return; }
    o.el.attr("display",null).attr("x",o.sx).attr("y",o.sy).attr("font-size",o.fs*px).attr("stroke-width",o.halo?(o.hw||2.5)*px:null)
        .attr("transform",o.rot?`rotate(${o.rot} ${o.sx} ${o.sy})`:null); });
}
const ask=()=>{ if(!raf) raf=requestAnimationFrame(layout); };
function fillOf(u){
  const r=R[U[u].r], city=isCity(u);
  if(layer==="P") return RM[r.realm].c;
  const dark={1:62,2:72,3:84,4:92}[U[u].tier];                 // the bigger the city, the darker its fill
  if(!r.p) return city?"#bdb7a8":"#e2dfd6";
  return city?mix(PCOL[r.p],dark,"#24140a"):mix(PCOL[r.p],46);
}
function applyLayer(){
  // each shape is also stroked in its own colour, so no hairline seams show between neighbours of one colour
  [pP,pC].forEach(s=>s.style("fill",fillOf).style("stroke",fillOf).attr("stroke-width",.9).attr("vector-effect","non-scaling-stroke"));
  const pol=layer==="P";
  [bProv,bReg,bCity,bCC].forEach(b=>b.attr("display",pol?"none":null)); bPars.attr("display",pol?null:"none");
  document.getElementById("lP").setAttribute("aria-pressed",pol); document.getElementById("lC").setAttribute("aria-pressed",!pol);
  legend(); layout();
}
const zoom=d3.zoom().scaleExtent([1,28]).translateExtent([[0,0],[M.W,M.H]]).on("zoom",e=>{ T=e.transform; g.attr("transform",T); ask(); });
svg.call(zoom); addEventListener("resize",ask); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ labels.forEach(o=>o.w=0); ask(); });
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick=()=>svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity);
document.getElementById("lP").onclick=()=>{layer="P";applyLayer();}; document.getElementById("lC").onclick=()=>{layer="C";applyLayer();};
// ---------- selection ----------
const citiesIn={}; cityIds.forEach(u=>(citiesIn[U[u].pv]=citiesIn[U[u].pv]||[]).push(U[u].n));
const provsIn={}; provIds.forEach(u=>(provsIn[U[u].r]=provsIn[U[u].r]||[]).push(U[u].n));
let sel=null;
function show(u){
  hl.attr("d",shape[u]); const un=U[u], rg=R[un.r], rm=RM[rg.realm], p=rg.p?M.players.find(x=>x.n===rg.p):null, city=isCity(u);
  const pvn=city?U[un.pv].n:un.n, cs=citiesIn[city?un.pv:u]||[];
  document.getElementById("info").innerHTML=`<p class="eyebrow">${city?"Город · "+un.rank:"Провинция"}</p><p class="name">${un.n}</p>
   <dl class="kv">${city?`<dt>Провинция</dt><dd>${pvn}</dd>`:""}
   <dt>Регион</dt><dd>${rg.ru}</dd>
   <dt>Держава</dt><dd><span class="sw" style="background:${rm.c}"></span>${rm.n}</dd>
   <dt>Игрок</dt><dd>${p?`<span class="sw" style="background:${p.c}"></span>№${p.n} ${p.name}`:"нет"}</dd>
   ${city?"":`<dt>Города</dt><dd>${cs.length?cs.join(", "):"—"}</dd>`}
   <dt>В регионе</dt><dd>${(provsIn[un.r]||[]).join(", ")}</dd></dl>`;
}
[pP,pC].forEach(s=>s.on("pointerenter",(e,u)=>show(u)).on("pointerleave",()=>{ if(sel!==null) show(sel); else hl.attr("d",""); }).on("click",(e,u)=>{sel=u;show(u);}));
function legend(){
  const ul=document.getElementById("legend"); ul.innerHTML="";
  if(layer==="P"){
    document.getElementById("lgT").textContent="Державы";
    Object.keys(RM).filter(k=>!RM[k].ind).forEach(k=>{ const li=document.createElement("li");
      li.innerHTML=`<span class="sw" style="width:18px;height:14px;background:${RM[k].c}"></span><span>${RM[k].n}</span>`; ul.appendChild(li); });
    { const li=document.createElement("li"); li.innerHTML=`<span class="sw" style="width:18px;height:14px;background:#d6d3cc"></span><span>Независимые народы и царства</span>`; ul.appendChild(li); }
    document.getElementById("lgN").textContent="Каждая держава залита целиком, без внутренних границ. Светлый пунктир в империи: раздел между Валентинианом и Валентом.";
  } else {
    document.getElementById("lgT").textContent="Игроки и их регионы";
    M.players.forEach(p=>{ const li=document.createElement("li");
      li.innerHTML=`<span class="dot" style="background:${p.c}">${p.n}</span><span>${p.name}<small>${p.regions.length?p.regions.join(", "):(p.secret?"тайное убежище, регионов нет":"регионов нет")}</small></span>`; ul.appendChild(li); });
    document.getElementById("lgN").textContent="Сплошная линия: граница региона. Пунктир: граница провинции. Тёмное пятно: город. Серые регионы без игрока.";
  }
}
document.getElementById("info").innerHTML=`<p class="eyebrow">Подсказка</p><p class="name">Наведите на карту</p><p class="note">Клик закрепляет выбор. В слое «Контроль регионов» при приближении появляются провинции и города.</p>`;
applyLayer();
</script>
