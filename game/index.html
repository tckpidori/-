<title>Пепельный тракт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Раскладка: полевая карта на бумаге во весь экран, сверху полоса состояния, снизу навигация;
   экраны выезжают листом — снизу на телефоне, справа на широком экране. Один тёмный вид оболочки. */
:root{
  --ink:#0e1317; --panel:#151c22; --raise:#1c252d; --line:#2b3741;
  --snow:#e2e8eb; --soft:#b8c3ca; --muted:#8797a3;
  --lamp:#e8a03a; --lamp-ink:#1b1206; --ember:#e07a4c; --blood:#d65a43; --frost:#7cb0d9; --ash:#c4ba54; --moss:#8fbc94;
  --paper:#f4eedc;
  --f-disp:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--snow);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding-block:6px;max-width:1500px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bad{color:var(--blood)}
svg{display:block}

#top{display:flex;align-items:center;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;min-width:0}
#stats{display:flex;gap:4px 12px;flex-wrap:wrap}
.need{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.need svg{width:15px;height:15px}
.need b{font-weight:600;min-width:2.2ch}
.need.crit b{color:var(--blood)}
#clock{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:2px 9px;flex-wrap:wrap;color:var(--soft)}
#clock .cold{color:var(--frost)} #clock .dim{color:var(--muted)}

#stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#a9c3d2;min-height:0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cond{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-width:60%}
#cond .chip{background:rgba(21,28,34,.9)}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(21,28,34,.92);color:var(--snow);font:600 17px var(--f-mono);cursor:pointer}

#route{position:absolute;left:8px;right:8px;bottom:8px;max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--lamp);border-radius:10px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rt{display:flex;flex-direction:column;gap:3px;min-width:0}
.rname{font-family:var(--f-disp);font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#sheet{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;min-height:0}
#sb{overflow:auto;padding:12px;min-height:0;flex:1;overscroll-behavior:contain}
.panes{display:grid;gap:14px}
.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.pane > *{flex:none}
.pane.side{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px}
.pane.side .cell,.pane.side .btn:not(.primary),.pane.side .sbtn{background:var(--panel)}
.panes.place .pane:first-child{order:2}
@media (min-aspect-ratio:1/1) and (min-width:620px){
  #sb{overflow:hidden;display:flex}
  .panes{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);height:100%;width:100%}
  .panes.one{grid-template-columns:minmax(0,1fr)}
  .pane{overflow:auto;min-height:0;overscroll-behavior:contain}
  .panes.place .pane:first-child{order:0}
  .invl{grid-template-columns:auto minmax(0,1fr)}
  .cats{flex-direction:column;overflow:visible}
}
.invl{display:grid;gap:10px;align-items:start}
.cats{display:flex;gap:6px;overflow-x:auto}
.cat{background:var(--raise);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:8px 10px;font:500 12.5px var(--f-body);cursor:pointer;white-space:nowrap;text-align:left}
.cat.sel{border-color:var(--lamp);color:var(--lamp)}
.invg{display:flex;flex-direction:column;gap:8px;min-width:0}
.doll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"head fig back" "mask fig armor" "body fig legs" "melee feet ranged";gap:6px}
.fig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.fig svg{width:72%;max-width:110px;height:auto}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:16px 8px 12px;color:var(--snow);font-family:var(--f-body);cursor:pointer;min-width:0}
.stile .sic svg{width:52px;height:52px}
.stile small{font-size:11.5px;color:var(--muted)}
.upm{position:absolute;top:5px;left:8px;color:var(--moss);font-style:normal;font-size:10.5px}
h3.lock{color:var(--blood)}
.qrow{display:flex;align-items:center;gap:8px}
.qrow b{font-family:var(--f-mono);min-width:3ch;text-align:center}
.btn.grow{flex:1}
.card.wide{max-width:640px}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perk{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 6px;color:var(--snow);font-family:var(--f-body);font-size:13px;cursor:pointer;min-width:0}
.perk .pm svg{width:44px;height:44px}
.perk small{font-size:11.5px;color:var(--muted)}
.needs .miss{color:var(--blood)}
.pi{display:block;width:100%;height:100%;background-repeat:no-repeat;background-size:400% 400%}
.cell{height:86px}
.cell .ic,.cell .ic svg{width:46px;height:46px}
.dic{width:60px;height:60px} .dic svg{width:60px;height:60px}
.mic{display:block;width:40px;height:40px} .mic svg{width:40px;height:40px}
.stile .sic{display:block;width:84px;height:84px} .stile .sic svg{width:84px;height:84px}
.phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ppic{display:block;width:84px;height:84px}
.foe{grid-template-columns:auto minmax(0,1fr) auto}
.fp{display:block;width:44px;height:44px;grid-row:span 2}
.fp:empty{display:none}
.foe .hp{grid-column:2/-1}
.perk .pm{display:block}
@media (orientation:landscape) and (max-height:520px){
  #app{gap:4px;padding-block:4px}
  #nav button{flex-direction:row;justify-content:center;gap:6px;padding:5px 4px;font-size:11.5px}
  #nav button svg{width:18px;height:18px}
  .shead{padding:0 6px 0 12px}
  #sb{padding:8px}
  .cell{height:70px;padding-top:12px}
  .cell .ic,.cell .ic svg{width:38px;height:38px}
  .ppic{width:56px;height:56px}
  .stile{padding:10px 6px 8px}
  .stile .sic,.stile .sic svg{width:56px;height:56px}
  .card{padding:10px;gap:6px}
  .clog{min-height:52px}
}
.shead{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);flex:none;font-family:var(--f-disp);font-size:13px;font-weight:500;letter-spacing:.04em}
.xbtn{width:36px;height:36px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}

#nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
#nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--muted);font:500 10.5px var(--f-body);padding:6px 2px 5px;cursor:pointer;min-width:0}
#nav button svg{width:21px;height:21px}
#nav button.on{color:var(--lamp);border-color:var(--lamp)}
.bdg{position:absolute;top:3px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--lamp);color:var(--lamp-ink);font:600 10px/16px var(--f-mono);font-style:normal;text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips.flat{margin-top:0}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--soft);white-space:nowrap;background:none;font-family:var(--f-body)}
button.chip{cursor:pointer;padding:5px 11px;font-size:12.5px}
.chip.sel{border-color:var(--lamp);color:var(--lamp)}
.chip.warm{border-color:var(--lamp);color:var(--lamp)} .chip.cold{color:var(--frost)} .chip.ash{color:var(--ash);border-color:var(--ash)} .chip.bad{color:var(--blood);border-color:var(--blood)}
.tabsrow{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}

.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2.loc{font-family:var(--f-disp);font-weight:500;font-size:18px;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
h3.big{font-family:var(--f-disp);font-size:19px;text-transform:none;letter-spacing:0;color:var(--snow);font-weight:500;margin:0}
.desc{color:var(--soft);margin:0 0 6px;max-width:62ch}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.hrow h3{margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(60px,76px))}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:76px;padding:16px 3px 4px;background:var(--raise);border:1px solid var(--line);border-radius:8px;color:var(--snow);font-family:var(--f-body);min-width:0;cursor:pointer}
.cell.info{cursor:default}
.cell .ic{width:34px;height:34px;flex:none}
.cell .ic svg{width:34px;height:34px}
.cell .cl{font-size:9.5px;line-height:1.15;color:var(--muted);width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cn{position:absolute;top:3px;right:5px;font:600 11px var(--f-mono);font-variant-numeric:tabular-nums}
.cell .cn.bad{color:var(--blood)}
.cell .ct{position:absolute;top:3px;left:5px;font:500 9.5px var(--f-mono);color:var(--lamp);max-width:90%;overflow:hidden;white-space:nowrap}
.cell.on{border-color:var(--lamp);background:#242f38}
.cell.dim{opacity:.45}

.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;border:1px solid var(--lamp);border-radius:8px;padding:12px;background:var(--panel)}
.detail.col{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.dic svg{width:44px;height:44px}
.dbt{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--raise);border:1px solid var(--line);color:var(--snow);border-radius:8px;padding:8px 11px;font:500 13.5px var(--f-body);cursor:pointer;min-height:44px;min-width:0}
.btn small{font-size:11.5px;color:var(--muted);font-weight:400}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.primary small{color:var(--lamp-ink);opacity:.72}
.btn.row{flex-direction:row;align-items:center;justify-content:center}
.btn.wide{width:100%;grid-column:1/-1}
button:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
.rbt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.items{display:flex;flex-direction:column}
.items.scroll{overflow:auto;min-height:0;flex:1}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.mic svg{width:30px;height:30px}
.nm{font-weight:500}
.q{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;margin-left:6px;font-weight:400}
.ef{font-size:11.5px;color:var(--muted)}
.ef.bad{color:var(--blood)}
.item .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:190px}
.sbtn{background:var(--raise);border:1px solid var(--line);color:var(--snow);border-radius:6px;padding:6px 10px;font:500 12.5px var(--f-body);cursor:pointer;min-height:34px;white-space:nowrap}
.sbtn.hot{border-color:var(--lamp);color:var(--lamp)}
.sbtn.ghost{background:none;color:var(--muted)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.needs{display:flex;flex-wrap:wrap;gap:2px 8px}
.need.miss,.needs .miss{color:var(--blood)}
.needs span{font-family:var(--f-mono);font-size:11px;color:var(--moss)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.rep{font-size:11.5px;text-align:right;color:var(--soft);line-height:1.3}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;color:var(--soft)}
.kv b{color:var(--snow);font-weight:600}

.hp{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.hp.thin{height:3px;margin-top:5px}
.hp i{display:block;height:100%;background:var(--blood)}
.hp.you i{background:var(--moss)}
#tripBar{background:var(--lamp)}
.hpline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:13px}
.log time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-top:2px}
.log li.bad span{color:var(--blood)} .log li.good span{color:var(--moss)}

#modal{position:fixed;inset:0;background:rgba(6,9,11,.74);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card.tall{height:100%;max-height:640px;overflow:hidden}
.tabs{display:grid;border-bottom:1px solid var(--line);flex:none}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:500 12.5px var(--f-body);padding:10px 2px;cursor:pointer}
.tabs button.on{color:var(--snow);border-bottom-color:var(--lamp)}
.foes{display:flex;flex-direction:column;gap:6px}
.foe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--snow);font:500 13.5px var(--f-body);cursor:pointer;text-align:left}
.foe .hp{grid-column:1/-1}
.foe.on{border-color:var(--lamp)}
.foe.dead{opacity:.4}
.clog{list-style:none;margin:0;padding:8px 10px;background:var(--ink);border-radius:8px;font-size:12.5px;color:var(--soft);display:flex;flex-direction:column;gap:3px;min-height:92px}
.clog li:last-child{color:var(--snow)}
.cbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60;padding:0 16px}
.toast{background:var(--raise);border:1px solid var(--line);color:var(--snow);padding:8px 14px;border-radius:8px;font-size:13px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .4s,transform .4s}
.toast.good{border-color:var(--moss)} .toast.bad{border-color:var(--blood)}
.toast.out{opacity:0;transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div id="app">
  <header id="top"><div id="stats"></div><div id="clock"></div></header>
  <main id="stage">
    <canvas id="map" aria-label="Карта: нажми на точку или здание, чтобы проложить маршрут"></canvas>
    <div id="cond"></div>
    <div class="mapbtns">
      <button id="zin" data-act="zin" aria-label="Приблизить">+</button>
      <button id="zout" data-act="zout" aria-label="Отдалить">−</button>
      <button id="zc" data-act="center" aria-label="К себе">◎</button>
    </div>
    <div id="route" hidden></div>
    <section id="sheet" hidden></section>
  </main>
  <nav id="nav"></nav>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="sim.js"></script>
<script src="art/manifest.js"></script>
<script src="icons.js"></script>
<script src="ui.js"></script>
